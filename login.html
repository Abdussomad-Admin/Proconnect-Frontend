<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · ProConnect</title>
  <link rel="stylesheet" href="Styles/choose-account-type.css" />
  <link rel="stylesheet" href="Styles/login.css" />
  <link rel="stylesheet" href="Styles/toast.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css" />
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">

      <section class="auth-panel">
        <div class="auth-brand">
          <span class="auth-brand__mark"><i class="ti ti-affiliate" aria-hidden="true"></i></span>
          <span class="auth-brand__name">Pro<span class="accent">Connect</span></span>
        </div>

        <h1 class="auth-panel__title">Welcome <span class="accent">back!</span></h1>
        <p class="auth-panel__subtitle">
          Login to your account and continue your journey with ProConnect.
        </p>

        <div class="auth-illustration">
          <img src="Image/Secure login-amico.png" alt="Login illustration" />
        </div>

        <p class="auth-panel__footer">Your account security is important to us.</p>
      </section>

      <section class="auth-form-panel">
        <h2 class="auth-form-panel__title">Log in to your account</h2>
        <p class="auth-form-panel__subtitle">Enter your credentials to access your account</p>

        <div class="form-alert" id="form-alert" role="alert" hidden></div>

        <form id="login-form" novalidate>

          <div class="field">
            <label for="login-id">Email or Username</label>
            <div class="input-with-icon">
              <i class="ti ti-mail field-icon" aria-hidden="true"></i>
              <input type="text" id="login-id" placeholder="Enter your email or username" autocomplete="username" />
            </div>
            <span class="field-error" id="err-login-id"></span>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-with-icon">
              <i class="ti ti-lock field-icon" aria-hidden="true"></i>
              <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
              <button type="button" class="icon-toggle" id="toggle-password" aria-label="Show password">
                <i class="ti ti-eye" aria-hidden="true"></i>
              </button>
            </div>
            <span class="field-error" id="err-password"></span>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="remember-me" />
              <span>Remember me</span>
            </label>
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary" id="btn-login">
            <span id="login-label">Log In</span>
          </button>

          <div class="auth-divider"><span>or</span></div>

          <button type="button" class="btn-outline" id="btn-google">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.85.86-3.05.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
              <path fill="#FBBC05" d="M3.97 10.71a5.4 5.4 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l3.01-2.33z"/>
              <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
            </svg>
            Continue with Google
          </button>

          <p class="auth-form-panel__login">
            Don't have an account? <a href="register-user.html">Sign up</a>
          </p>

        </form>
      </section>

    </div>
  </main>

  <script src="Scripts/config.js"></script>
  <script src="Scripts/toast.js"></script>
  <script src="Scripts/login.js"></script>
</body>
</html>
