<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home · ProConnect</title>
  <link rel="stylesheet" href="Styles/dashboard.css" />
  <link rel="stylesheet" href="Styles/feed.css" />
  <link rel="stylesheet" href="Styles/toast.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css" />
</head>
<body data-page="dashboard">

  <div class="app-shell">

    <div id="sidebar-root"></div>

    <main class="app-main">

      <header class="app-topbar">
        <div class="app-search">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input type="text" placeholder="Search posts, people, jobs, skills..." />
        </div>

        <div class="topbar-nav-icons" id="topbar-nav-icons"></div>

        <div class="app-topbar__icons">
<div class="topbar-user" id="topbar-user-toggle">
            <img id="topbar-avatar" hidden alt="" />
            <span id="topbar-name">—</span>
            <i class="ti ti-chevron-down" aria-hidden="true"></i>
          </div>

          <div class="dropdown-menu" id="topbar-dropdown">
            <a href="profile-overview.html" class="dropdown-menu__item"><i class="ti ti-user" aria-hidden="true"></i> View Profile</a>
            <a href="#" class="dropdown-menu__item"><i class="ti ti-settings" aria-hidden="true"></i> Settings</a>
            <button type="button" class="dropdown-menu__item dropdown-menu__item--danger" id="topbar-logout"><i class="ti ti-logout" aria-hidden="true"></i> Log out</button>
          </div>
        </div>
      </header>

      <div class="app-content feed-layout">

        <div class="feed-main">

          <!-- Composer -->
          <section class="card composer-card">
            <div class="composer-top">
              <img id="composer-avatar" class="composer-avatar" src="" alt="" hidden />
              <span id="composer-avatar-fallback" class="composer-avatar composer-avatar--fallback" hidden></span>
              <textarea id="composer-textarea" placeholder="What's on your mind?" rows="2"></textarea>
            </div>

            <div id="composer-file-preview" class="composer-file-preview"></div>

            <div class="composer-bottom">
              <div class="composer-actions">
                <button type="button" class="composer-action-btn" id="composer-photo-btn">
                  <i class="ti ti-photo" aria-hidden="true"></i> Photo
                </button>
                <button type="button" class="composer-action-btn" id="composer-video-btn">
                  <i class="ti ti-video" aria-hidden="true"></i> Video
                </button>
                <input type="file" id="composer-file-input" accept="image/*,video/*" multiple hidden />

                <select id="composer-visibility" class="composer-visibility">
                  <option value="Public">🌐 Public</option>
                  <option value="Connections">👥 Connections only</option>
                </select>
              </div>

              <button type="button" class="btn-primary-sm composer-post-btn" id="composer-post-btn" disabled>Post</button>
            </div>
          </section>

          <!-- Feed tabs -->
          <nav class="feed-tabs">
            <button type="button" class="feed-tab is-active" data-tab="ForYou">For you</button>
            <button type="button" class="feed-tab" data-tab="Following">Following</button>
            <button type="button" class="feed-tab" data-tab="Connections">Connections</button>
            <button type="button" class="feed-tab" data-tab="Latest">Latest</button>
          </nav>

          <!-- Feed -->
          <div id="feed-list" class="feed-list">
            <p class="app-loading-inline">Loading feed...</p>
          </div>
          <p class="empty-note" id="feed-empty" hidden>No posts to show here yet.</p>
          <button type="button" class="btn-load-more" id="btn-load-more-feed" hidden>Load more</button>

        </div>

      </div>
    </main>
  </div>

  <div class="toast-stack" id="toast-stack"></div>

  <script src="Scripts/sidebar.js"></script>
  <script src="Scripts/config.js"></script>
  <script src="Scripts/feed.js"></script>
  <script src="Scripts/toast.js"></script>
</body>
</html>
