<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password · ProConnect</title>
  <link rel="stylesheet" href="Styles/choose-account-type.css" />
  <link rel="stylesheet" href="Styles/forgot-reset-password.css" />
  <link rel="stylesheet" href="Styles/toast.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css" />
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">

      <section class="auth-panel">
        <div class="auth-brand">
          <span class="auth-brand__mark"><i class="ti ti-affiliate" aria-hidden="true"></i></span>
          <span class="auth-brand__name">Pro<span class="accent">Connect</span></span>
        </div>

        <h1 class="auth-panel__title">Forgot your <span class="accent">password?</span></h1>
        <p class="auth-panel__subtitle">
          No worries — enter your email and we'll send you a reset code.
        </p>

        <div class="auth-illustration">
          <img src="Image/VerificationImage.png" alt="Forgot password illustration" />
        </div>

        <p class="auth-panel__footer">Your account security is important to us.</p>
      </section>

      <section class="auth-form-panel auth-form-panel--centered">

        <div class="verify-icon">
          <i class="ti ti-key" aria-hidden="true"></i>
        </div>

        <h2 class="auth-form-panel__title">Reset your password</h2>
        <p class="auth-form-panel__subtitle">
          Enter the email address linked to your account and we'll send a 6-digit reset code.
        </p>

        <div class="form-alert" id="form-alert" role="alert" hidden></div>

        <form id="forgot-form" novalidate style="width:100%;">

          <div class="field" style="text-align:left;">
            <label for="email">Email Address</label>
            <div class="input-with-icon">
              <i class="ti ti-mail field-icon" aria-hidden="true"></i>
              <input type="email" id="email" placeholder="Enter your email" autocomplete="email" />
            </div>
            <span class="field-error" id="err-email"></span>
          </div>

          <button type="submit" class="btn-primary" id="btn-send-code">
            <span id="send-code-label">Send reset code</span>
          </button>

          <p class="auth-form-panel__login">
            Remembered your password? <a href="login.html">Log in</a>
          </p>

        </form>

      </section>

    </div>
  </main>

  <script src="Scripts/config.js"></script>
  <script src="Scripts/forgotPassword.js"></script>
  <script src="Scripts/toast.js"></script>
</body>
</html>
