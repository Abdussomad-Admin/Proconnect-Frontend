<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Followers · ProConnect</title>
  <link rel="stylesheet" href="Styles/dashboard.css" />
  <link rel="stylesheet" href="Styles/network-shared.css" />
  <link rel="stylesheet" href="Styles/toast.css" />
  <link rel="stylesheet" href="Styles/followers.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css" />
</head>
<body data-page="network">

  <div class="app-shell">

    <div id="sidebar-root"></div>

    <main class="app-main">

      <header class="app-topbar">
        <div class="app-search">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input type="text" placeholder="Search people, jobs, skills..." />
        </div>

        <div class="app-topbar__icons">
<div class="topbar-user" id="topbar-user-toggle">
            <img id="topbar-avatar" hidden alt="" />
            <span id="topbar-name">—</span>
            <i class="ti ti-chevron-down" aria-hidden="true"></i>
          </div>

          <div class="dropdown-menu" id="topbar-dropdown">
            <a href="profile-overview.html" class="dropdown-menu__item"><i class="ti ti-user" aria-hidden="true"></i> View Profile</a>
            <a href="#" class="dropdown-menu__item"><i class="ti ti-settings" aria-hidden="true"></i> Settings</a>
            <button type="button" class="dropdown-menu__item dropdown-menu__item--danger" id="topbar-logout"><i class="ti ti-logout" aria-hidden="true"></i> Log out</button>
          </div>
        </div>
      </header>

      <div class="app-content">

        <div class="page-heading">
          <h1>Followers</h1>
          <p>People who follow your professional updates and activity.</p>
        </div>

        <!-- Tabs -->
        <nav class="network-tabs">
          <a href="network-overview.html" class="network-tab">Overview</a>
          <a href="discover-people.html" class="network-tab">People You May Know</a>
          <a href="pending-requests.html" class="network-tab">
            Pending Requests
            <span class="network-tab__badge" id="tab-badge-pending" hidden></span>
          </a>
          <a href="connections.html" class="network-tab">
            Connections
            <span class="network-tab__badge" id="tab-badge-connections" hidden></span>
          </a>
          <a href="followers.html" class="network-tab is-active">
            Followers
            <span class="network-tab__badge" id="tab-badge-followers" hidden></span>
          </a>
        </nav>

        <!-- Stat strip -->
        <div class="network-stat-strip network-stat-strip--2col">
          <div class="stat-pill">
            <span class="stat-pill__icon"><i class="ti ti-users" aria-hidden="true"></i></span>
            <span>
              <strong id="stat-followers">—</strong>
              <span>Followers</span>
            </span>
          </div>
          <div class="stat-pill">
            <span class="stat-pill__icon"><i class="ti ti-user-check" aria-hidden="true"></i></span>
            <span>
              <strong id="stat-following">—</strong>
              <span>Following</span>
            </span>
          </div>
        </div>

        <!-- Sub-tabs: Followers / Following -->
        <div class="follow-subtabs">
          <button type="button" class="follow-subtab is-active" data-subtab="followers">Followers</button>
          <button type="button" class="follow-subtab" data-subtab="following">Following</button>
        </div>

        <section class="card" id="panel-followers">
          <div class="network-search">
            <i class="ti ti-search" aria-hidden="true"></i>
            <input type="text" id="followers-filter-input" placeholder="Search followers by name..." />
          </div>
          <div id="followers-list" class="network-list">
            <p class="app-loading-inline">Loading followers...</p>
          </div>
          <p class="empty-note" id="followers-empty" hidden>No one follows you yet.</p>
          <button type="button" class="btn-load-more" id="btn-load-more-followers" hidden>View more</button>
        </section>

        <section class="card" id="panel-following" hidden>
          <div class="network-search">
            <i class="ti ti-search" aria-hidden="true"></i>
            <input type="text" id="following-filter-input" placeholder="Search people you follow..." />
          </div>
          <div id="following-list" class="network-list">
            <p class="app-loading-inline">Loading...</p>
          </div>
          <p class="empty-note" id="following-empty" hidden>You're not following anyone yet.</p>
          <button type="button" class="btn-load-more" id="btn-load-more-following" hidden>View more</button>
        </section>

      </div>
    </main>
  </div>

  <div class="toast-stack" id="toast-stack"></div>

  <script src="Scripts/sidebar.js"></script>
  <script src="Scripts/config.js"></script>
  <script src="Scripts/followers.js"></script>
  <script src="Scripts/toast.js"></script>
</body>
</html>
