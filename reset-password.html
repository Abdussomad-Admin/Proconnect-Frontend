<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password · ProConnect</title>
  <link rel="stylesheet" href="Styles/choose-account-type.css" />
  <link rel="stylesheet" href="Styles/forgot-reset-password.css" />
  <link rel="stylesheet" href="Styles/toast.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css" />
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">

      <section class="auth-panel">
        <div class="auth-brand">
          <span class="auth-brand__mark"><i class="ti ti-affiliate" aria-hidden="true"></i></span>
          <span class="auth-brand__name">Pro<span class="accent">Connect</span></span>
        </div>

        <h1 class="auth-panel__title">Almost <span class="accent">there!</span></h1>
        <p class="auth-panel__subtitle">
          Enter the code we sent you and choose a new password.
        </p>

        <div class="auth-illustration">
          <img src="Image/VerificationImage.png" alt="Reset password illustration" />
        </div>

        <p class="auth-panel__footer">Your account security is important to us.</p>
      </section>

      <section class="auth-form-panel">
        <h2 class="auth-form-panel__title">Reset your password</h2>
        <p class="auth-form-panel__subtitle" id="reset-subtitle">
          Enter the 6-digit code sent to your email.
        </p>

        <div class="form-alert" id="form-alert" role="alert" hidden></div>

        <form id="reset-form" novalidate>

          <div class="field">
            <label for="email">Email Address</label>
            <div class="input-with-icon">
              <i class="ti ti-mail field-icon" aria-hidden="true"></i>
              <input type="email" id="email" placeholder="Enter your email" autocomplete="email" />
            </div>
            <span class="field-error" id="err-email"></span>
          </div>

          <div class="field">
            <label for="reset-code">Reset code</label>
            <div class="input-with-icon">
              <i class="ti ti-shield-lock field-icon" aria-hidden="true"></i>
              <input
                type="text"
                id="reset-code"
                class="code-input"
                placeholder="Enter 6-digit code"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="6"
              />
            </div>
            <span class="field-error" id="err-reset-code"></span>
          </div>

          <div class="field">
            <label for="new-password">New password</label>
            <div class="input-with-icon">
              <i class="ti ti-lock field-icon" aria-hidden="true"></i>
              <input type="password" id="new-password" placeholder="Create a new password" autocomplete="new-password" />
              <button type="button" class="icon-toggle" id="toggle-new-password" aria-label="Show password">
                <i class="ti ti-eye" aria-hidden="true"></i>
              </button>
            </div>
            <span class="field-error" id="err-new-password"></span>
          </div>

          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <div class="input-with-icon">
              <i class="ti ti-lock field-icon" aria-hidden="true"></i>
              <input type="password" id="confirm-password" placeholder="Confirm your new password" autocomplete="new-password" />
              <button type="button" class="icon-toggle" id="toggle-confirm-password" aria-label="Show password">
                <i class="ti ti-eye" aria-hidden="true"></i>
              </button>
            </div>
            <span class="field-error" id="err-confirm-password"></span>
          </div>

          <button type="submit" class="btn-primary" id="btn-reset">
            <span id="reset-label">Reset password</span>
          </button>

          <p class="resend-row">
            Didn't get a code?
            <button type="button" id="btn-resend">Resend code</button>
            <span id="resend-cooldown" hidden></span>
          </p>

          <p class="auth-form-panel__login">
            Remembered your password? <a href="login.html">Log in</a>
          </p>

        </form>
      </section>

    </div>
  </main>

  <script src="Scripts/config.js"></script>
  <script src="Scripts/resetPassword.js"></script>
  <script src="Scripts/toast.js"></script>
</body>
</html>
