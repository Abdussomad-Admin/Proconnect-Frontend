<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics Dashboard · ProConnect</title>
  <link rel="stylesheet" href="Styles/dashboard.css" />
  <link rel="stylesheet" href="Styles/analytics-dashboard.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body data-page="analytics-dashboard">

  <div class="app-shell">

    <div id="sidebar-root"></div>

    <main class="app-main">

      <header class="app-topbar">
        <div class="app-search">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input type="text" placeholder="Search posts, people, jobs, or companies..." />
        </div>
        <div class="app-topbar__icons">
          <div class="topbar-user" id="topbar-user-toggle">
            <img id="topbar-avatar" hidden alt="" />
            <span id="topbar-name">—</span>
            <i class="ti ti-chevron-down" aria-hidden="true"></i>
          </div>
          <div class="dropdown-menu" id="topbar-dropdown">
            <a href="profile-overview.html" class="dropdown-menu__item"><i class="ti ti-user" aria-hidden="true"></i> View Profile</a>
            <button type="button" class="dropdown-menu__item dropdown-menu__item--danger" id="topbar-logout"><i class="ti ti-logout" aria-hidden="true"></i> Log out</button>
          </div>
        </div>
      </header>

      <div class="app-content">

        <div class="an-header">
          <div>
            <h1 class="an-title">Analytics Dashboard</h1>
            <p class="an-subtitle">Track your performance, grow your network, and make data-driven decisions.</p>
          </div>
          <div class="an-header__actions">
            <select id="date-range-select" class="an-select">
              <option value="Last7Days">Last 7 days</option>
              <option value="Last30Days" selected>Last 30 days</option>
              <option value="Last90Days">Last 90 days</option>
              <option value="LastYear">Last year</option>
            </select>
          </div>
        </div>

        <div class="form-alert" id="form-alert" role="alert" hidden></div>

        <div class="an-kpi-row">
          <div class="card an-kpi-card">
            <div class="an-kpi-card__icon"><i class="ti ti-eye" aria-hidden="true"></i></div>
            <div class="an-kpi-card__label">Profile Views</div>
            <div class="an-kpi-card__value" id="kpi-views">—</div>
            <div class="an-kpi-card__delta" id="kpi-views-delta"></div>
          </div>

          <div class="card an-kpi-card">
            <div class="an-kpi-card__icon"><i class="ti ti-users" aria-hidden="true"></i></div>
            <div class="an-kpi-card__label">New Connections</div>
            <div class="an-kpi-card__value" id="kpi-connections">—</div>
            <div class="an-kpi-card__delta" id="kpi-connections-delta"></div>
          </div>

          <div class="card an-kpi-card">
            <div class="an-kpi-card__icon"><i class="ti ti-briefcase" aria-hidden="true"></i></div>
            <div class="an-kpi-card__label">Job Applications</div>
            <div class="an-kpi-card__value" id="kpi-applications">—</div>
            <div class="an-kpi-card__delta" id="kpi-applications-delta"></div>
          </div>

          <div class="card an-kpi-card">
            <div class="an-kpi-card__icon"><i class="ti ti-message-2" aria-hidden="true"></i></div>
            <div class="an-kpi-card__label">Post Engagements</div>
            <div class="an-kpi-card__value" id="kpi-engagements">—</div>
            <div class="an-kpi-card__delta" id="kpi-engagements-delta"></div>
          </div>
        </div>

        <div class="an-chart-row">
          <div class="card an-chart-card">
            <div class="an-chart-card__header">
              <h3>Network Growth</h3>
            </div>
            <canvas id="network-growth-chart" height="220"></canvas>
          </div>

          <aside class="an-sidebar">
            <div class="card an-sidebar-card">
              <div class="an-sidebar-card__header">
                <h3>Top Performing Posts</h3>
              </div>
              <div id="top-posts-list" class="an-top-posts">
                <div class="jm-loading" id="top-posts-loading">
                  <span class="spinner spinner--dark"></span>
                </div>
              </div>
            </div>
          </aside>
        </div>

        <div class="an-chart-row an-chart-row--single">
          <div class="card an-chart-card">
            <div class="an-chart-card__header">
              <h3>Follower Growth</h3>
            </div>
            <canvas id="follower-growth-chart" height="180"></canvas>
          </div>
        </div>

        <p style="text-align: center;">
          <a href="profile-insights.html" class="link-btn">View full Profile Insights <i class="ti ti-arrow-right" aria-hidden="true"></i></a>
        </p>

      </div>

    </main>
  </div>

  <script src="Scripts/config.js"></script>
  <script src="Scripts/sidebar.js"></script>
  <script src="Scripts/analyticsDashboard.js"></script>
</body>
</html>
