<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Activity Logs · ProConnect Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="Styles/admin-layout.css" />
  <link rel="stylesheet" href="Styles/admin-common.css" />
</head>

<body
  data-page="admin-activity-logs"
  data-title="Activity Logs"
  data-subtitle="Track all system activities and admin actions."
  data-icon="ti-history">

  <main id="admin-content">
    <div class="ad-filterbar">
      <label class="ad-filter-search">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="search" id="ad-search" placeholder="Search by user, action, or description..." />
      </label>

      <input type="text" class="ad-select" id="ad-action" placeholder="Action (e.g. Suspend)" style="width:170px;" />

      <input type="date" class="ad-select" id="ad-from" title="From date" />
      <input type="date" class="ad-select" id="ad-to" title="To date" />

      <select class="ad-select" id="ad-page-size">
        <option value="10">10 / page</option>
        <option value="25">25 / page</option>
        <option value="50">50 / page</option>
      </select>
    </div>

    <div class="ad-card">
      <div class="ad-table-wrap">
        <table class="ad-table">
          <thead>
            <tr><th>Date &amp; Time</th><th>Admin</th><th>Action</th><th>Description</th></tr>
          </thead>
          <tbody id="ad-rows">
            <tr class="ad-skeleton-row"><td colspan="4"><div class="ad-skeleton"></div></td></tr>
            <tr class="ad-skeleton-row"><td colspan="4"><div class="ad-skeleton"></div></td></tr>
            <tr class="ad-skeleton-row"><td colspan="4"><div class="ad-skeleton"></div></td></tr>
          </tbody>
        </table>
      </div>
      <div class="ad-pagination" id="ad-pagination"></div>
    </div>
  </main>

  <script src="Scripts/config.js"></script>
  <script src="Scripts/adminLayout.js"></script>
  <script>
    const state = { search: "", action: "", from: "", to: "", pageNumber: 1, pageSize: 10 };
    let searchDebounce = null, actionDebounce = null;

    function authHeaders() {
      const token = localStorage.getItem("pc_token") || sessionStorage.getItem("pc_token");
      return token ? { Authorization: `Bearer ${token}` } : {};
    }
    function esc(v) { return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
    function fmtDateTime(iso) {
      return iso ? new Date(iso).toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }) : "—";
    }

    async function fetchList() {
      const params = new URLSearchParams();
      if (state.search) params.set("search", state.search);
      if (state.action) params.set("action", state.action);
      if (state.from) params.set("from", state.from);
      if (state.to) params.set("to", state.to);
      params.set("pageNumber", state.pageNumber);
      params.set("pageSize", state.pageSize);
      params.set("usePaging", "true");

      const res = await fetch(`${API_ROUTES.adminActivityLogs}?${params.toString()}`, { headers: authHeaders() });
      const body = await res.json().catch(() => ({}));
      if (!res.ok || body.status === false) throw new Error(body.message || "Failed to load activity logs");
      return body.data;
    }

    function renderRows(items) {
      const tbody = document.getElementById("ad-rows");
      if (!items || items.length === 0) { tbody.innerHTML = `<tr><td colspan="4"><div class="ad-empty">No activity matches these filters.</div></td></tr>`; return; }

      tbody.innerHTML = items.map(a => `
        <tr>
          <td>${fmtDateTime(a.timestamp)}</td>
          <td>
            <div class="ad-cell-user">
              ${a.userAvatarUrl ? `<img src="${esc(a.userAvatarUrl)}" alt="" />` : `<span class="ad-fallback">${esc((a.userName || "?").charAt(0).toUpperCase())}</span>`}
              <div><strong>${esc(a.userName)}</strong></div>
            </div>
          </td>
          <td><span class="ad-badge ad-badge--purple">${esc(a.action)}</span></td>
          <td style="color:var(--ad-text-2);">${esc(a.description)}</td>
        </tr>`).join("");
    }

    function renderPagination(pageNumber, pageSize, totalCount) {
      const el = document.getElementById("ad-pagination");
      const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
      const from = totalCount === 0 ? 0 : (pageNumber - 1) * pageSize + 1;
      const to = Math.min(pageNumber * pageSize, totalCount);
      const pages = [];
      for (let p = 1; p <= Math.min(5, totalPages); p++) pages.push(p);
      if (totalPages > 6) pages.push("…");
      if (totalPages > 5) pages.push(totalPages);

      el.innerHTML = `
        <span>Showing ${from.toLocaleString()}–${to.toLocaleString()} of ${totalCount.toLocaleString()}</span>
        <div class="ad-pagination__pages">
          <button type="button" data-page="${pageNumber - 1}" ${pageNumber <= 1 ? "disabled" : ""}><i class="ti ti-chevron-left"></i></button>
          ${pages.map(p => p === "…" ? `<span>…</span>` : `<button type="button" data-page="${p}" class="${p === pageNumber ? "is-current" : ""}">${p}</button>`).join("")}
          <button type="button" data-page="${pageNumber + 1}" ${pageNumber >= totalPages ? "disabled" : ""}><i class="ti ti-chevron-right"></i></button>
        </div>`;
      el.querySelectorAll("button[data-page]").forEach(btn => btn.addEventListener("click", () => { state.pageNumber = Number(btn.dataset.page); load(); }));
    }

    async function load() {
      const tbody = document.getElementById("ad-rows");
      tbody.innerHTML = `<tr class="ad-skeleton-row"><td colspan="4"><div class="ad-skeleton"></div></td></tr>`.repeat(3);
      try {
        const data = await fetchList();
        renderRows(data.items);
        renderPagination(data.pageNumber, data.pageSize, data.totalCount);
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4"><div class="ad-empty" style="color:#D64545;">Couldn't load activity logs: ${esc(err.message)}</div></td></tr>`;
        document.getElementById("ad-pagination").innerHTML = "";
      }
    }

    document.getElementById("ad-page-size").addEventListener("change", (e) => { state.pageSize = Number(e.target.value); state.pageNumber = 1; load(); });
    document.getElementById("ad-search").addEventListener("input", (e) => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => { state.search = e.target.value.trim(); state.pageNumber = 1; load(); }, 350);
    });
    document.getElementById("ad-action").addEventListener("input", (e) => {
      clearTimeout(actionDebounce);
      actionDebounce = setTimeout(() => { state.action = e.target.value.trim(); state.pageNumber = 1; load(); }, 350);
    });
    document.getElementById("ad-from").addEventListener("change", (e) => { state.from = e.target.value; state.pageNumber = 1; load(); });
    document.getElementById("ad-to").addEventListener("change", (e) => { state.to = e.target.value; state.pageNumber = 1; load(); });

    load();
  </script>
</body>
</html>
