<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jobs Management · ProConnect Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="Styles/admin-layout.css" />
  <link rel="stylesheet" href="Styles/admin-common.css" />
</head>

<body
  data-page="admin-jobs"
  data-title="Jobs Management"
  data-subtitle="Manage and monitor all job postings on the platform."
  data-icon="ti-briefcase">

  <main id="admin-content">
    <div class="ad-filterbar">
      <label class="ad-filter-search">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="search" id="ad-search" placeholder="Search by title, company, or location..." />
      </label>

      <input type="text" class="ad-select" id="ad-industry" placeholder="Industry" style="width:140px;" />

      <select class="ad-select" id="ad-status-filter">
        <option value="">All Statuses</option>
        <option value="Active">Active</option>
        <option value="PendingApproval">Pending Approval</option>
        <option value="Scheduled">Scheduled</option>
        <option value="Draft">Draft</option>
        <option value="Closed">Closed</option>
      </select>

      <select class="ad-select" id="ad-page-size">
        <option value="10">10 / page</option>
        <option value="25">25 / page</option>
        <option value="50">50 / page</option>
      </select>
    </div>

    <div class="ad-card">
      <div class="ad-table-wrap">
        <table class="ad-table">
          <thead>
            <tr><th>Job Title</th><th>Company</th><th>Location</th><th>Type</th><th>Applications</th><th>Status</th><th>Posted</th><th></th></tr>
          </thead>
          <tbody id="ad-rows">
            <tr class="ad-skeleton-row"><td colspan="8"><div class="ad-skeleton"></div></td></tr>
            <tr class="ad-skeleton-row"><td colspan="8"><div class="ad-skeleton"></div></td></tr>
            <tr class="ad-skeleton-row"><td colspan="8"><div class="ad-skeleton"></div></td></tr>
          </tbody>
        </table>
      </div>
      <div class="ad-pagination" id="ad-pagination"></div>
    </div>
  </main>

  <script src="Scripts/config.js"></script>
  <script src="Scripts/adminLayout.js"></script>
  <script>
    const state = { search: "", industry: "", status: "", pageNumber: 1, pageSize: 10 };
    let searchDebounce = null, industryDebounce = null;

    function authHeaders() {
      const token = localStorage.getItem("pc_token") || sessionStorage.getItem("pc_token");
      return token ? { Authorization: `Bearer ${token}` } : {};
    }
    function esc(v) { return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
    function fmtDate(iso) { return iso ? new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "—"; }
    function fmtSalary(min, max) {
      if (min == null && max == null) return "—";
      const f = (n) => n != null ? `$${Number(n).toLocaleString()}` : "?";
      return `${f(min)} – ${f(max)}`;
    }

    const STATUS_BADGE = { Active: "success", PendingApproval: "warn", Scheduled: "info", Draft: "", Closed: "danger" };
    const STATUS_LABEL = { Active: "Active", PendingApproval: "Pending Approval", Scheduled: "Scheduled", Draft: "Draft", Closed: "Closed" };
    function statusBadge(status) {
      const tone = STATUS_BADGE[status] ?? "";
      return `<span class="ad-badge${tone ? ` ad-badge--${tone}` : ""}">${esc(STATUS_LABEL[status] || status)}</span>`;
    }
    function actionsFor(status) {
      const actions = [];
      if (status === "PendingApproval") actions.push({ action: "approve", label: "Approve", icon: "ti-circle-check" });
      if (status !== "Closed") actions.push({ action: "close", label: "Close Job", icon: "ti-player-stop", danger: true });
      return actions;
    }

    async function fetchList() {
      const params = new URLSearchParams();
      if (state.search) params.set("search", state.search);
      if (state.industry) params.set("industry", state.industry);
      if (state.status) params.set("status", state.status);
      params.set("pageNumber", state.pageNumber);
      params.set("pageSize", state.pageSize);
      params.set("usePaging", "true");

      const res = await fetch(`${API_ROUTES.adminJobs}?${params.toString()}`, { headers: authHeaders() });
      const body = await res.json().catch(() => ({}));
      if (!res.ok || body.status === false) throw new Error(body.message || "Failed to load jobs");
      return body.data;
    }

    async function performAction(jobId, action) {
      const reason = prompt("Reason for this action (optional):") || null;
      const res = await fetch(`${API_ROUTES.adminJobs}/${jobId}/${action}`, {
        method: "POST", headers: { "Content-Type": "application/json", ...authHeaders() }, body: JSON.stringify({ reason }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok || body.status === false) { alert(body.message || "Action failed"); return; }
      load();
    }

    function renderRows(items) {
      const tbody = document.getElementById("ad-rows");
      if (!items || items.length === 0) { tbody.innerHTML = `<tr><td colspan="8"><div class="ad-empty">No jobs match these filters.</div></td></tr>`; return; }

      tbody.innerHTML = items.map(j => `
        <tr>
          <td>
            <div class="ad-cell-user is-square">
              ${j.companyLogoUrl ? `<img src="${esc(j.companyLogoUrl)}" alt="" />` : `<span class="ad-fallback">${esc((j.companyName || "?").charAt(0).toUpperCase())}</span>`}
              <div><strong>${esc(j.title)}</strong><span>${esc(j.department || "—")}</span></div>
            </div>
          </td>
          <td><a href="admin-company-details.html?id=${j.companyId}" style="color:var(--ad-purple); text-decoration:none;">${esc(j.companyName)}</a></td>
          <td>${esc(j.location)}</td>
          <td>${esc(j.employmentType)}</td>
          <td>${j.applicationsCount}</td>
          <td>${statusBadge(j.status)}</td>
          <td>${fmtDate(j.postedDate)}</td>
          <td>
            <div class="ad-row-actions">
              <button type="button" class="ad-row-toggle" data-id="${j.jobId}" aria-label="Actions"><i class="ti ti-dots-vertical" aria-hidden="true"></i></button>
              <div class="ad-row-menu" data-menu-for="${j.jobId}">
                <a href="admin-job-details.html?id=${j.jobId}"><i class="ti ti-eye" aria-hidden="true"></i> View Details</a>
                ${actionsFor(j.status).map(a => `<button type="button" class="item${a.danger ? " is-danger" : ""}" data-action="${a.action}" data-id="${j.jobId}"><i class="ti ${a.icon}" aria-hidden="true"></i> ${a.label}</button>`).join("")}
              </div>
            </div>
          </td>
        </tr>`).join("");

      tbody.querySelectorAll(".ad-row-toggle").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const menu = tbody.querySelector(`.ad-row-menu[data-menu-for="${btn.dataset.id}"]`);
          tbody.querySelectorAll(".ad-row-menu.is-open").forEach(m => { if (m !== menu) m.classList.remove("is-open"); });
          menu.classList.toggle("is-open");
        });
      });
      tbody.querySelectorAll(".ad-row-menu button.item").forEach(btn => btn.addEventListener("click", () => performAction(btn.dataset.id, btn.dataset.action)));
    }

    function renderPagination(pageNumber, pageSize, totalCount) {
      const el = document.getElementById("ad-pagination");
      const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
      const from = totalCount === 0 ? 0 : (pageNumber - 1) * pageSize + 1;
      const to = Math.min(pageNumber * pageSize, totalCount);
      const pages = [];
      for (let p = 1; p <= Math.min(5, totalPages); p++) pages.push(p);
      if (totalPages > 6) pages.push("…");
      if (totalPages > 5) pages.push(totalPages);

      el.innerHTML = `
        <span>Showing ${from.toLocaleString()}–${to.toLocaleString()} of ${totalCount.toLocaleString()}</span>
        <div class="ad-pagination__pages">
          <button type="button" data-page="${pageNumber - 1}" ${pageNumber <= 1 ? "disabled" : ""}><i class="ti ti-chevron-left"></i></button>
          ${pages.map(p => p === "…" ? `<span>…</span>` : `<button type="button" data-page="${p}" class="${p === pageNumber ? "is-current" : ""}">${p}</button>`).join("")}
          <button type="button" data-page="${pageNumber + 1}" ${pageNumber >= totalPages ? "disabled" : ""}><i class="ti ti-chevron-right"></i></button>
        </div>`;
      el.querySelectorAll("button[data-page]").forEach(btn => btn.addEventListener("click", () => { state.pageNumber = Number(btn.dataset.page); load(); }));
    }

    async function load() {
      const tbody = document.getElementById("ad-rows");
      tbody.innerHTML = `<tr class="ad-skeleton-row"><td colspan="8"><div class="ad-skeleton"></div></td></tr>`.repeat(3);
      try {
        const data = await fetchList();
        renderRows(data.items);
        renderPagination(data.pageNumber, data.pageSize, data.totalCount);
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8"><div class="ad-empty" style="color:#D64545;">Couldn't load jobs: ${esc(err.message)}</div></td></tr>`;
        document.getElementById("ad-pagination").innerHTML = "";
      }
    }

    document.getElementById("ad-status-filter").addEventListener("change", (e) => { state.status = e.target.value; state.pageNumber = 1; load(); });
    document.getElementById("ad-page-size").addEventListener("change", (e) => { state.pageSize = Number(e.target.value); state.pageNumber = 1; load(); });
    document.getElementById("ad-search").addEventListener("input", (e) => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => { state.search = e.target.value.trim(); state.pageNumber = 1; load(); }, 350);
    });
    document.getElementById("ad-industry").addEventListener("input", (e) => {
      clearTimeout(industryDebounce);
      industryDebounce = setTimeout(() => { state.industry = e.target.value.trim(); state.pageNumber = 1; load(); }, 350);
    });
    document.addEventListener("click", () => document.querySelectorAll(".ad-row-menu.is-open").forEach(m => m.classList.remove("is-open")));

    load();
  </script>
</body>
</html>
